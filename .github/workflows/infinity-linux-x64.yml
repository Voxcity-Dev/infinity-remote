# Infinity Remote: build só do Linux x86_64 (.deb), disparado à mão, com o MESMO
# ambiente reprodutível do build local (build-env/docker/Dockerfile.linux +
# build-linux.sh). Servidor, chave pública e API vêm de build-env/<ambiente>.env
# (entrada "ambiente": homolog ou prod), conferidos por build-env/carregar-env.sh.
# As variáveis do repositório (vars.*) NÃO são mais lidas. Não publica release:
# só artefato do run.
# O .deb exige glibc >= 2.35 (Ubuntu 22.04+/Debian 12+), como o build local.
name: Infinity Linux x64 (dispatch)

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente embutido no programa (build-env/<ambiente>.env)"
        required: true
        type: choice
        options:
          - homolog
          - prod

run-name: "Infinity Linux x64 (${{ inputs.ambiente }})"

permissions:
  contents: read

jobs:
  build-linux-x64:
    name: x86_64-unknown-linux-gnu (Infinity, .deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          sudo mkdir -p /mnt/ir-cache /mnt/ir-cache/vcpkg-installed && sudo chown -R "$(id -u):$(id -g)" /mnt/ir-cache
          df -h / /mnt

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # falha cedo (antes da imagem e do build) se o ambiente estiver incompleto
      - name: Check build-env/<ambiente>.env
        env:
          AMBIENTE: ${{ inputs.ambiente }}
        run: |
          set -euo pipefail
          . build-env/carregar-env.sh "$AMBIENTE"

      - name: Build image (build-env/docker/Dockerfile.linux)
        run: docker build -t infinity-remote-build:linux -f build-env/docker/Dockerfile.linux .github/patches

      - name: Build .deb (build-env/docker/build-linux.sh <ambiente>)
        env:
          AMBIENTE: ${{ inputs.ambiente }}
        run: |
          C=/mnt/ir-cache
          docker run --rm -u "$(id -u):$(id -g)" -e CARGO_BUILD_JOBS=4 -e VCPKG_MAX_CONCURRENCY=4 \
            -v "$PWD":/workspace -v "$C":/cache -v "$C/vcpkg-installed":/opt/vcpkg/installed \
            infinity-remote-build:linux bash build-env/docker/build-linux.sh "$AMBIENTE"
          sha256sum infinity-remote-*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infinity-remote-linux-x86_64-deb-${{ inputs.ambiente }}
          path: infinity-remote-*.deb
